[Unit]
# The upstream dnsdist.service ships StartLimitInterval=0 (no cap at all);
# override it so a bad/incompatible generated dnsdist.conf can't restart
# forever -- systemd marks the unit failed after 5 attempts per minute
# instead.
StartLimitIntervalSec=60
StartLimitBurst=5

[Service]
Environment=ALDERPOINTDNS_DNS_PLAIN=1
Environment=ALDERPOINTDNS_DNS_DOH=1
Environment=ALDERPOINTDNS_DNS_DOT=1
# DoQ/DoH3 require a dnsdist build with QUIC support. Debian 13's own
# archive dnsdist package (the default, no PowerDNS repository required)
# does not include it, so these start disabled; Encryption Settings only
# lets an administrator enable them once dnsdist_capabilities() confirms
# the installed build actually supports them.
Environment=ALDERPOINTDNS_DNS_DOQ=0
Environment=ALDERPOINTDNS_DNS_DOH3=0
