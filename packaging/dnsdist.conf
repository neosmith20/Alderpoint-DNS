-- BindGuard generated dnsdist configuration.
-- Lab-safe default: loopback-only client listeners until allowed networks are configured.

setSecurityPollSuffix("")
setACL({"127.0.0.0/8", "::1/128"})
addACL("127.0.0.0/8")
addACL("::1/128")

setMaxTCPClientThreads(4)
setMaxTCPQueuedConnections(512)
setMaxUDPOutstanding(4096)
setMaxTCPConnectionsPerClient(20)
setTCPRecvTimeout(5)
setTCPSendTimeout(5)
setUDPTimeout(2)
setRingBuffersSize(10000, 10)

controlSocket("127.0.0.1:5199")
setConsoleACL({"127.0.0.1/32", "::1/128"})
setKey("BINDGUARD_CONSOLE_KEY_PLACEHOLDER")

webserver("127.0.0.1:8083")
setWebserverConfig({
  acl="127.0.0.1/32,::1/128",
  password="BINDGUARD_WEBSERVER_PASSWORD_PLACEHOLDER",
  apiKey="BINDGUARD_WEBSERVER_API_KEY_PLACEHOLDER",
  statsRequireAuthentication=true,
  apiRequiresAuthentication=true,
  dashboardRequiresAuthentication=true
})

newServer({
  address="127.0.0.1:5353",
  name="bind-local",
  checkName="cloudflare.com.",
  checkType="A",
  mustResolve=true,
  maxCheckFailures=3
})

pc = newPacketCache(100000, {
  maxTTL=86400,
  minTTL=0,
  temporaryFailureTTL=60,
  staleTTL=60
})
getPool(""):setCache(pc)

addAction(OrRule({
  OpcodeRule(DNSOpcode.Notify),
  OpcodeRule(DNSOpcode.Update),
  QTypeRule(DNSQType.AXFR),
  QTypeRule(DNSQType.IXFR)
}), RCodeAction(DNSRCode.REFUSED))

local dbr = dynBlockRulesGroup()
dbr:setQueryRate(120, 10, "BindGuard private resolver query rate limit", 60)
dbr:setRCodeRate(DNSRCode.NXDOMAIN, 80, 10, "BindGuard private resolver NXDOMAIN rate limit", 60)
dbr:setRCodeRate(DNSRCode.SERVFAIL, 40, 10, "BindGuard private resolver SERVFAIL rate limit", 60)
dbr:setQTypeRate(DNSQType.ANY, 10, 10, "BindGuard private resolver ANY rate limit", 60)
function maintenance()
  dbr:apply()
end

addLocal("127.0.0.1:53", {reusePort=true})
addDOHLocal("127.0.0.1:443", {"/etc/bindguard/certs/bindguard-lab.crt"}, {"/etc/bindguard/certs/bindguard-lab.key"}, {
  "/dns-query"
}, {
  reusePort=true,
  minTLSVersion="tls1.2",
  ciphers="HIGH:!aNULL:!MD5:!RC4"
})
addTLSLocal("127.0.0.1:853", {"/etc/bindguard/certs/bindguard-lab.crt"}, {"/etc/bindguard/certs/bindguard-lab.key"}, {
  reusePort=true,
  minTLSVersion="tls1.2",
  ciphers="HIGH:!aNULL:!MD5:!RC4"
})
