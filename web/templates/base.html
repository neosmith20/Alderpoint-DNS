<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}BindGuard{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {% if admin %}
    <div class="app-shell">
      <header class="app-topbar" id="appTopbar">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true">
            <svg width="19" height="21" viewBox="0 0 19 21" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9.5 1.6 16.6 4v5.7c0 4.5-2.8 8.3-7.1 9.8-4.3-1.5-7.1-5.3-7.1-9.8V4l7.1-2.4Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="M6 10.2 8.5 13l4.8-5.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span>BindGuard</span>
        </a>
        <button class="mobile-nav-toggle secondary" type="button" data-nav-toggle aria-controls="appNav" aria-expanded="false">Menu</button>
        <nav class="app-nav" id="appNav" aria-label="Primary navigation">
          <a href="/" {{ 'aria-current="page"' if request.url.path == "/" else "" }}>Dashboard</a>
          <a href="/query-log" {{ 'aria-current="page"' if request.url.path == "/query-log" else "" }}>Query Log</a>
          <a href="/custom-rules" {{ 'aria-current="page"' if request.url.path == "/custom-rules" else "" }}>Filters</a>
          <a href="/blocklists" {{ 'aria-current="page"' if request.url.path == "/blocklists" else "" }}>Blocklists</a>
          <a href="/local-dns" {{ 'aria-current="page"' if request.url.path == "/local-dns" else "" }}>Local DNS</a>
          <a href="/dns-settings" {{ 'aria-current="page"' if request.url.path == "/dns-settings" else "" }}>DNS Settings</a>
          <a href="/statistics-settings" {{ 'aria-current="page"' if request.url.path == "/statistics-settings" else "" }}>Statistics</a>
          <a href="/system" {{ 'aria-current="page"' if request.url.path == "/system" else "" }}>System</a>
        </nav>
        <div class="account-menu">
          <span class="status-badge status-badge--{{ protection.tone if protection is defined else 'neutral' }}">{{ protection.label if protection is defined else 'Active' }}</span>
          <form method="post" action="/logout"><button class="secondary">Logout</button></form>
        </div>
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
  {% else %}
    <main class="auth-shell">{{ self.content() }}</main>
  {% endif %}
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
