<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BindGuard</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f6f7f9; color: #18202a; }
    header { background: #101820; color: white; padding: 12px 18px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
    header a, header button { color: white; text-decoration: none; background: transparent; border: 0; font: inherit; cursor: pointer; }
    main { max-width: 1180px; margin: 0 auto; padding: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .grid.compact { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .card, table, form.panel { background: white; border: 1px solid #d9dde3; border-radius: 6px; padding: 14px; }
    .card { min-width: 0; overflow: hidden; }
    .card, .card *, td, th { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
    .card p { margin: 0; }
    .card h3 { margin-top: 0; }
    .metric { font-size: 1.7rem; font-weight: 700; }
    .card-list { display: grid; gap: 6px; }
    .secondary { display: block; margin-top: 6px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 0.88em; }
    table { width: 100%; min-width: 0; table-layout: fixed; border-collapse: collapse; padding: 0; overflow: hidden; }
    th, td { padding: 10px; border-bottom: 1px solid #e8ebef; text-align: left; vertical-align: top; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
    input, select { width: 100%; box-sizing: border-box; padding: 9px; border: 1px solid #b7c0cc; border-radius: 4px; }
    button, .button { background: #155e75; color: white; border: 0; padding: 9px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; }
    .danger { background: #9f1239; }
    .muted { color: #607080; }
    .ok { color: #047857; }
    .bad { color: #b91c1c; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; margin: 12px 0; }
    .toolbar label { min-width: 150px; }
    .empty { border: 1px dashed #b7c0cc; border-radius: 6px; padding: 20px; color: #607080; }
    .chart-wrap { min-width: 0; overflow: hidden; }
    canvas { width: 100%; max-width: 100%; height: 260px; display: block; }
    pre { white-space: pre-wrap; overflow: auto; background: #111827; color: #e5e7eb; padding: 12px; border-radius: 6px; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #e5e7eb; }
      .card, table, form.panel { background: #1f2937; border-color: #334155; }
      th, td { border-color: #334155; }
      input, select { background: #111827; color: #e5e7eb; border-color: #475569; }
    }
  </style>
</head>
<body>
  <header>
    <strong>BindGuard</strong>
    {% if admin %}
      <a href="/">Dashboard</a>
      <a href="/blocklists">Blocklists</a>
      <a href="/custom-rules">Custom Rules</a>
      <a href="/dns-settings">DNS Settings</a>
      <a href="/query-log">Query Log</a>
      <a href="/statistics-settings">Statistics</a>
      <a href="/system">System</a>
      <form method="post" action="/logout" style="margin-left:auto"><button>Logout</button></form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
