{% extends "base.html" %}
{% block content %}
<h1>Custom Rules</h1>
<form class="panel" method="post" action="/custom-rules/add">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="grid">
    <label>Action <select name="action"><option value="block">Block</option><option value="allow">Allow</option></select></label>
    <label>Domain <input name="domain" required></label>
    <label>Comment <input name="comment"></label>
  </div>
  <p><button>Add and Deploy</button></p>
</form>
<table>
  <tr><th>Domain</th><th>Action</th><th>State</th><th>Comment</th><th>Actions</th></tr>
  {% for r in rules %}
  <tr>
    <td>{{ r.domain }}</td><td>{{ r.action }}</td><td>{{ "enabled" if r.enabled else "disabled" }}</td><td>{{ r.comment }}</td>
    <td class="row">
      <form method="post" action="/custom-rules/{{ r.id }}/toggle"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Toggle</button></form>
      <form method="post" action="/custom-rules/{{ r.id }}/delete"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="danger">Delete</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
