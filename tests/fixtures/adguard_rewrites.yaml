# Focused AdGuard Home migration fixture covering DNS rewrite handling,
# using the current AdGuardHome.yaml schema (filtering.rewrites_enabled +
# a boolean enabled per rewrite). Complements adguard_home.yaml, which
# covers user_rules classification and only a handful of rewrites; this
# fixture exists specifically to exercise: multiple answers for the same
# hostname, a rewrite disabled at the source, and AdGuard's "A"/"AAAA"
# pass-through/exclusion sentinel values (which must never be read as
# literal addresses or turned into bogus single-label CNAME targets).
filtering:
  rewrites_enabled: true
  rewrites:
    - domain: nas.home.arpa
      answer: 192.168.1.50
      enabled: true
    - domain: nas.home.arpa
      answer: 192.168.1.51
      enabled: true
    - domain: printer.home.arpa
      answer: fd00::50
      enabled: true
    - domain: alias.home.arpa
      answer: nas.home.arpa
      enabled: true
    - domain: retired.home.arpa
      answer: 192.168.1.60
      enabled: false
    - domain: excluded.home.arpa
      answer: A
      enabled: true
    - domain: excluded6.home.arpa
      answer: AAAA
      enabled: true
