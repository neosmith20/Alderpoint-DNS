# Minimal synthetic AdGuardHome.yaml used only by
# tests/test_clean_install_container.sh. Deliberately not the richer
# adguard_home.yaml fixture the Python unit tests use: that fixture's
# allow-rule domains are all fake and would fail alderpointdns_compiler.py
# deploy()'s live post-deploy allowed-domain health check, which resolves
# the allow-listed domain for real. cloudflare.com is used here because
# deploy() special-cases it as the preferred allow-domain test target.
#
# The filtering.rewrites block uses the current AdGuard Home schema
# (filtering.rewrites_enabled + a boolean enabled per rewrite) and covers an
# A record, an AAAA record, a CNAME-style alias, one rewrite disabled at the
# source, and one rewrite whose domain (otherlan.test) is deliberately NOT
# Alderpoint DNS's internal domain (home.arpa) -- this is the real-world
# shape that a beta tester's actual AdGuardHome.yaml has (their own LAN
# domain, not Alderpoint DNS's), and reproduces a second real regression
# where such rewrites were misclassified as Custom Filtering Rules instead
# of Local DNS. All addresses are private/reserved so BIND's own
# authoritative answer is checked, never live reachability of the address.
filters:
  - name: Clean Install Test Blocklist
    url: https://filters.example/clean-install-test.txt
    enabled: true
user_rules:
  - '||clean-install-block.invalid^'
  - '@@||cloudflare.com^'
filtering:
  rewrites_enabled: true
  rewrites:
    - domain: clean-install-nas.home.arpa
      answer: 192.168.50.10
      enabled: true
    - domain: clean-install-printer.home.arpa
      answer: fd00:beef::50
      enabled: true
    - domain: clean-install-alias.home.arpa
      answer: clean-install-nas.home.arpa
      enabled: true
    - domain: clean-install-disabled.home.arpa
      answer: 192.168.50.11
      enabled: false
    - domain: clean-install-router.otherlan.test
      answer: 192.168.50.12
      enabled: true
